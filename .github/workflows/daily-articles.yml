# 毎日 JST 7:00 にRSSを巡回し、HOW TO記事（テーマ表に「採用」があるときだけ）の下書きをClaudeで作り、検査後に main へ保存する。
# news（RSS起点のフロー記事）の自動生成は 2026-09-13 に停止した（理由は docs/progress_gsc-2026-09.md）。手動実行で count を指定したときだけ動く。
# draft:true のためサイトには出ない。一次情報との照合・加筆を人が行い、draft:false にしたコミットで公開する。
name: daily-articles

on:
  schedule:
    - cron: "0 22 * * *" # 22:00 UTC = 07:00 JST
  workflow_dispatch:
    inputs:
      count:
        description: "生成するニュース記事数（0で生成しない。定期実行では常に0扱い）"
        default: "0"

permissions:
  contents: write

# 前回の実行と重ならないようにする（記事idの採番とpushが競合するため）
concurrency:
  group: daily-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 最後の push 前に rebase するため浅いクローンにしない
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 生成（Anthropic課金）の前に置く関門。mainが壊れていたら、1円も使わずここで終える。
      # 2026-08-28〜30の3便は、mainに src/lib/apps.ts が無いまま sitemap.ts がimportしていた
      # （PR #7 の一部が先に入った状態）ために generate の後の検証で落ち、生成済みの記事ごと捨てて
      # API代だけが残った。この不整合は tsc が TS2307 で検出できる種類のものなので、先に一度回す。
      # Actions分数は public リポジトリでは無料。有限なのはAPI代だけ、という前提で順番を決めている。
      - name: 生成前にmainの健全性を検査
        run: npm run typecheck && npm test

      - name: 候補を収集
        run: npx tsx scripts/collect.ts

      # news（RSS起点のフロー記事）の自動生成は 2026-09-13 に停止した。
      # Search Consoleの3か月分（docs/progress_gsc-2026-09.md）で、記事84本の表示合計85回に対し
      # /tools と /glossary の2枚だけで139回。出典元と同じクエリに並ぶだけのフロー記事は
      # 表示にも順位にも出ていない。collect は残す（ツール検知と話題の把握に使うため）。
      # 大きなニュースを手で出したいときは workflow_dispatch から count を指定して回す。
      - name: 記事にする候補を自動採用（手動実行のときだけ）
        if: github.event_name == 'workflow_dispatch' && inputs.count != '0'
        run: npx tsx scripts/pick.ts ${{ inputs.count }}

      - name: ニュース記事を生成（手動実行のときだけ）
        if: github.event_name == 'workflow_dispatch' && inputs.count != '0'
        run: npx tsx scripts/generate.ts ${{ inputs.count }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # HOW TO（ストック記事）。テーマと出典は人が content/howto-topics.csv に書き、「採用」を付けたものだけが対象。
      # 「採用」が1件も無い日は何もせず正常終了するので、無条件に置いてよい（テーマ表が空なら自然に止まる）。
      # news をRSSから量産しても出典元と同じクエリに並ぶだけなので、日次の枠はこちらだけにしてある（2026-09-13〜）。
      - name: HOW TO記事を生成（テーマ表に「採用」があるときだけ）
        id: howto
        run: npx tsx scripts/generate-howto.ts 1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 過去記事への内部リンクの補充。教科書のレッスンや用語集が増えると、過去記事から張れるリンクも増えるので毎日かけ直す。
      # **本文の文言は1字も変えない**（既に本文にある語を [語](/path) で包むだけ。判定は src/lib/internalLinks.ts）。
      # 1記事あたり3本で打ち切るので、張り終わった記事は何度走らせても差分が出ない（毎日の差分は自然に0へ収束する）。
      # 生成の後に置くのは、この日できた記事にも同じ上限で足すため。壊れたMDXは後続の本番ビルドで止まる。
      - name: 過去記事に内部リンクを差し込む
        run: |
          npx tsx scripts/internal-links.ts --write > /tmp/links.log
          cat /tmp/links.log
          {
            echo '### 内部リンクの補充'
            echo ''
            echo '```'
            cat /tmp/links.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 差分の有無
        id: diff
        run: |
          git add -A content
          git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      # 壊れたMDX・存在しない図解コンポーネントを本番に出さないための関門。
      # npm test には記事の不変条件（id の重複・ファイル名と id の一致・sources の有無）が入っている。
      # 2026-08 に id 43 が3本できて本番ビルドが落ちた事故は、ここで公開前に止まる。
      # ここで落ちたら以降のステップを実行しないので、その日は何も公開されず、候補の状態変更も残らない。
      - name: 本番ビルドで検証
        if: steps.diff.outputs.changed == 'true'
        run: npm run typecheck && npm test && npm run build

      - name: 下書きを保存（main へ反映）
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 記事の下書きと候補リストを更新"
          git pull --rebase origin main
          git push origin HEAD:main

      # 生成の失敗をここで落とす。generate-howto.ts は失敗しても exit 0 で終える
      # （メモを書いた content/howto-topics.csv を commit する前に止めると原因が残らない）ので、
      # 保存が済んだあとのこのステップが赤にして下のLINE通知を鳴らす。
      # 2026-09-17〜19、「採用」3件が3日連続で全滅していたのに、緑のまま誰も気づかなかった。
      - name: HOW TO生成の失敗を検知
        if: steps.howto.outputs.failed != ''
        run: |
          echo "::error::HOW TO記事の生成が ${{ steps.howto.outputs.failed }} 件失敗しました（content/howto-topics.csv の note を確認。status は「候補」に戻っています）"
          exit 1

      # ワークフローの赤は誰も見ていない、という前提で運用する。落ちたらスマホに届ける。
      # 認証情報が無ければ黙ってスキップするので、未設定のうちは何も起きない。
      # 設定するもの（Actions Secrets）: LINE_CHANNEL_ACCESS_TOKEN / LINE_USER_ID
      # 未設定のままにするなら、GitHubの通知設定（Settings > Notifications > Actions）で
      # 「Only notify for failed workflows」を有効にして、失敗をメールで受けること。
      - name: 失敗をLINE通知
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ] || [ -z "$LINE_USER_ID" ]; then
            echo "LINE_CHANNEL_ACCESS_TOKEN / LINE_USER_ID が未設定のため通知をスキップします"
            exit 0
          fi
          TEXT=$(printf '%s\n' \
            "🚨 seo-geo-web の記事自動生成が失敗しました" \
            "その日の記事は公開されていません。" \
            "$RUN_URL")
          jq -n --arg to "$LINE_USER_ID" --arg text "$TEXT" \
            '{to: $to, messages: [{type: "text", text: $text}]}' \
            | curl -sS -X POST https://api.line.me/v2/bot/message/push \
                -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d @- || echo "LINE通知に失敗しました（本処理には影響しません）"
