# 毎日 JST 7:00 にRSSを巡回し、候補を自動採用してClaudeで記事を書き、本番ビルドが通ったら main に直接pushする（=公開）。
# 人のレビューは挟まない。品質の関門は scripts/generate.ts の validate() と、この workflow の本番ビルドの2つ。
name: daily-articles

on:
  schedule:
    - cron: "0 22 * * *" # 22:00 UTC = 07:00 JST
  workflow_dispatch:
    inputs:
      count:
        description: "生成する記事数"
        default: "2"
      draft:
        description: "draft:true のまま止める（公開しない）"
        type: boolean
        default: false

permissions:
  contents: write

# 前回の実行と重ならないようにする（記事idの採番とpushが競合するため）
concurrency:
  group: daily-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 最後の push 前に rebase するため浅いクローンにしない
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 候補を収集
        run: npx tsx scripts/collect.ts

      - name: 記事にする候補を自動採用
        run: npx tsx scripts/pick.ts ${{ inputs.count || 2 }}

      - name: 記事を生成
        run: npx tsx scripts/generate.ts ${{ inputs.count || 2 }} ${{ inputs.draft == true && '--draft' || '--publish' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 差分の有無
        id: diff
        run: |
          git add -A content
          git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      # 壊れたMDX・存在しない図解コンポーネントを本番に出さないための関門。
      # ここで落ちたら以降のステップを実行しないので、その日は何も公開されず、候補の状態変更も残らない。
      - name: 本番ビルドで検証
        if: steps.diff.outputs.changed == 'true'
        run: npm run typecheck && npm run build

      - name: 公開（main へ反映）
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 記事を自動生成して公開"
          git pull --rebase origin main
          git push origin HEAD:main
