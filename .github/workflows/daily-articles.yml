# 毎日 JST 7:00 にRSSを巡回し、候補を自動採用してClaudeで記事を書き、本番ビルドが通ったら main に直接pushする（=公開）。
# 人のレビューは挟まない。品質の関門は scripts/generate.ts の validate() と、この workflow の本番ビルドの2つ。
name: daily-articles

on:
  schedule:
    - cron: "0 22 * * *" # 22:00 UTC = 07:00 JST
  workflow_dispatch:
    inputs:
      count:
        description: "生成する記事数"
        default: "2"
      draft:
        description: "draft:true のまま止める（公開しない）"
        type: boolean
        default: false

permissions:
  contents: write

# 前回の実行と重ならないようにする（記事idの採番とpushが競合するため）
concurrency:
  group: daily-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 最後の push 前に rebase するため浅いクローンにしない
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 生成（Anthropic課金）の前に置く関門。mainが壊れていたら、1円も使わずここで終える。
      # 2026-08-28〜30の3便は、mainに src/lib/apps.ts が無いまま sitemap.ts がimportしていた
      # （PR #7 の一部が先に入った状態）ために generate の後の検証で落ち、生成済みの記事ごと捨てて
      # API代だけが残った。この不整合は tsc が TS2307 で検出できる種類のものなので、先に一度回す。
      # Actions分数は public リポジトリでは無料。有限なのはAPI代だけ、という前提で順番を決めている。
      - name: 生成前にmainの健全性を検査
        run: npm run typecheck

      - name: 候補を収集
        run: npx tsx scripts/collect.ts

      - name: 記事にする候補を自動採用
        run: npx tsx scripts/pick.ts ${{ inputs.count || 2 }}

      - name: 記事を生成
        run: npx tsx scripts/generate.ts ${{ inputs.count || 2 }} ${{ inputs.draft == true && '--draft' || '--publish' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 差分の有無
        id: diff
        run: |
          git add -A content
          git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
          # 新しく増えた記事ファイル（公開後のLINE通知に使う）。修正だけの回は空になる。
          {
            echo "articles<<EOF"
            git diff --cached --name-only --diff-filter=A -- content/articles
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 壊れたMDX・存在しない図解コンポーネントを本番に出さないための関門。
      # ここで落ちたら以降のステップを実行しないので、その日は何も公開されず、候補の状態変更も残らない。
      - name: 本番ビルドで検証
        if: steps.diff.outputs.changed == 'true'
        run: npm run typecheck && npm run build

      - name: 公開（main へ反映）
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 記事を自動生成して公開"
          git pull --rebase origin main
          git push origin HEAD:main

      # 公開できた記事をXに手で投稿するための通知。投稿文をそのまま送るので、長押しでコピーして貼るだけ。
      # 自動投稿はしない（文面と投稿タイミングは人が決める）。
      - name: 公開をLINE通知
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.articles != ''
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # 記事URLの組み立てに使う。未設定だと localhost のURLを送ってしまうのでここで固定する。
          NEXT_PUBLIC_SITE_URL: https://seo-geo-lab.com
          ARTICLES: ${{ steps.diff.outputs.articles }}
        run: npx tsx scripts/notify.ts $ARTICLES

      # ワークフローの赤は誰も見ていない、という前提で運用する。落ちたらスマホに届ける。
      # 認証情報が無ければ黙ってスキップするので、未設定のうちは何も起きない。
      # 設定するもの（Actions Secrets）: LINE_CHANNEL_ACCESS_TOKEN / LINE_USER_ID
      - name: 失敗をLINE通知
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ] || [ -z "$LINE_USER_ID" ]; then
            echo "LINE_CHANNEL_ACCESS_TOKEN / LINE_USER_ID が未設定のため通知をスキップします"
            exit 0
          fi
          TEXT=$(printf '%s\n' \
            "🚨 seo-geo-web の記事自動生成が失敗しました" \
            "その日の記事は公開されていません。" \
            "$RUN_URL")
          jq -n --arg to "$LINE_USER_ID" --arg text "$TEXT" \
            '{to: $to, messages: [{type: "text", text: $text}]}' \
            | curl -sS -X POST https://api.line.me/v2/bot/message/push \
                -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d @- || echo "LINE通知に失敗しました（本処理には影響しません）"
